    <style>
      html,
      body,

        min-height: 100%;
        margin: 0;

      [data-initial-hero] {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        background: #0f172a;
      }

      [data-initial-hero] picture,
      [data-initial-hero] img,
      [data-initial-hero] [data-initial-hero-overlay] {
        position: absolute;
        inset-inline: 0;
        top: 0;
        width: 100%;
        height: 58svh;
      }

      [data-initial-hero] picture {
        display: block;
        overflow: hidden;
        background-image: url('/newBackground.webp');
        background-position: 63% 48%;
        background-size: cover;
      }

      [data-initial-hero] img {
        object-fit: cover;
        object-position: 63% 48%;
      }

      [data-initial-hero] [data-initial-hero-overlay] {
        background: linear-gradient(rgba(15, 23, 42, 0.18), rgba(15, 23, 42, 0.08));
      }

      @media (min-width: 640px) {
        [data-initial-hero] picture,
        [data-initial-hero] img,
        [data-initial-hero] [data-initial-hero-overlay] {
          inset: 0;
          height: 100%;
        }

        [data-initial-hero] img {
          object-position: center;
        }

        [data-initial-hero] picture {
          background-image: url('/newBackground.webp');
          background-position: center;
        }

        [data-initial-hero] [data-initial-hero-overlay] {
          background: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.35));
        }
      }

    <script>
      ;(() => {
        if ('scrollRestoration' in window.history) {
          window.history.scrollRestoration = 'manual'
        }
        if (window.location.hash) {
          window.history.replaceState(
            window.history.state,
            '',
            `${window.location.pathname}${window.location.search}`,
          )
        }
        window.scrollTo(0, 0)

        const supabaseUrl = '%VITE_SUPABASE_URL%'
        const supabaseKey = '%VITE_SUPABASE_ANON_KEY%'

        if (
          !supabaseUrl.startsWith('https://') ||
          !supabaseKey ||
          supabaseUrl.includes('your-project') ||
          supabaseKey.includes('your-anon-key')
        ) {
          return
        }

        const controller = new AbortController()
        const timeout = window.setTimeout(() => controller.abort(), 6000)
        const contentPromise = fetch(
          `${supabaseUrl.replace(/\/$/, '')}/rest/v1/site_content?id=eq.main&select=content`,
          {
            signal: controller.signal,
            headers: {
              apikey: supabaseKey,
              Authorization: `Bearer ${supabaseKey}`,
              Accept: 'application/json',
            },
          },
        )
          .then((response) => (response.ok ? response.json() : null))
          .then((rows) => rows?.[0]?.content ?? null)
          .catch(() => null)
          .finally(() => window.clearTimeout(timeout))

        window.__GERKA_SITE_CONTENT_PROMISE__ = contentPromise

        contentPromise.then((content) => {
          const gallerySections = Array.isArray(content?.gallerySections)
            ? content.gallerySections
            : []
          const preloaders = gallerySections.flatMap((section) =>
            Array.isArray(section?.items)
              ? section.items.flatMap((item) => {
                  const asset = item?.image
                  if (!asset?.src || asset.type === 'video') return []

                  let source = asset.webp || asset.avif || asset.src

                  if (asset.src.includes('/storage/v1/object/public/')) {
                    try {
                      const url = new URL(asset.src)
                      url.pathname = url.pathname.replace(
                        '/storage/v1/object/public/',
                        '/storage/v1/render/image/public/',
                      )
                      url.searchParams.set('width', '640')
                      url.searchParams.set('quality', '78')
                      url.searchParams.set('resize', 'contain')
                      url.searchParams.set('format', 'webp')
                      source = url.toString()
                    } catch {
                      source = asset.webp || asset.avif || asset.src
                    }
                  }

                  const image = new Image()
                  image.decoding = 'async'
                  image.fetchPriority = 'low'
                  image.src = source
                  return [image]
                })
              : [],
          )

          window.__GERKA_GALLERY_PRELOADS__ = preloaders
        })
      })()
    </script>

  <body>
    <div id="root">

        aria-hidden="true"
        data-initial-hero

            media="(max-width: 639px)"
            srcset="/newBackground.webp"
          />

            src="/newBackground.webp"
            alt=""
            class="h-full w-full object-cover object-[63%_48%] sm:object-center"
            fetchpriority="high"
            decoding="sync"
          />

        <div
          data-initial-hero-overlay
          class="absolute inset-x-0 top-0 -z-10 h-[58svh] bg-[linear-gradient(rgba(15,23,42,0.18),rgba(15,23,42,0.08))] sm:inset-0 sm:h-full sm:bg-[linear-gradient(rgba(15,23,42,0.55),rgba(15,23,42,0.35))]"
        ></div>
